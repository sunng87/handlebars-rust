[package]
name = "playground"
version = "0.1.0"
authors = ["Ning Sun <sunng@protonmail.com>"]
edition = "2018"
# Wasm demo deployed to GitHub Pages; never publish to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.63"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

gloo-utils = { version = "0.1.5", features = ["serde"] }
handlebars = { path = "../" }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

# Code-size settings (`opt-level = "s"`, `strip`) live in the workspace root
# as [profile.release.package.playground] — profiles in members are ignored.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
